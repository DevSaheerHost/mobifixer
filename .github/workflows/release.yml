name: release

# Builds the signed APK, publishes it as a GitHub Release, and points
# updates/apk.json at it so the app's own updater can find it.
#
# Deliberately separate from checks.yml and deliberately tag-driven: a release
# installs over a real shop's app, so it happens when someone tags it, not on
# every push to main.
#
#   git tag v5.1.1 && git push origin v5.1.1
#
# The tag must match the version in package.json, which is also the APK's
# versionName and what the updater compares against. The job refuses to run if
# they disagree, because a mismatch means every install would either never see
# the update or keep downloading it forever.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, publish nothing'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Fail here rather than three minutes into a build, and name the missing
      # secret. Never echo a value: only whether it is set.
      - name: Check the signing secrets are present
        env:
          KS: ${{ secrets.MF_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.MF_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.MF_KEY_ALIAS }}
          KP: ${{ secrets.MF_KEY_PASSWORD }}
        run: |
          missing=
          [ -n "$KS" ]  || missing="$missing MF_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing MF_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || missing="$missing MF_KEY_ALIAS"
          [ -n "$KP" ]  || missing="$missing MF_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "An unsigned APK will not install, so this stops here."
            echo "See 'Release signing' in README.md."
            exit 1
          fi
          echo "all four signing secrets are set"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag but package.json is $pkg"
            echo "They have to agree: package.json is the APK's versionName and"
            echo "what the updater compares against."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_ENV"

      - name: Resolve the version for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install the SDK pieces variables.gradle pins
        run: |
          sdk="$(command -v sdkmanager \
            || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Assemble the payload and sync it
        run: node scripts/build-www.mjs && npx cap sync android

      # Written outside the workspace so a stray `git add .` in a later step
      # cannot pick it up, and removed again whatever happens.
      - name: Decode the keystore
        env:
          # Through the environment, not interpolated into the run block:
          # Actions writes that block to a file on the runner, which would put
          # the keystore's base64 on disk in a second place for no reason.
          KS_B64: ${{ secrets.MF_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "keystore decoded empty"; exit 1; }
          echo "keystore decoded, $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

      - name: Build the signed release APK
        env:
          MF_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MF_KEYSTORE_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
          MF_KEY_ALIAS: ${{ secrets.MF_KEY_ALIAS }}
          MF_KEY_PASSWORD: ${{ secrets.MF_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Always remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The one check that matters. An unsigned APK is produced silently by the
      # build when signing is not configured, and will not install on a phone;
      # shipping one to the Releases tab would be worse than failing here.
      - name: Verify it is actually signed
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "no app-release.apk - the build produced an unsigned one"; ls -la android/app/build/outputs/apk/release/; exit 1; }
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --verbose "$apk" | tee verify.out
          grep -q '^Verifies$' verify.out || { echo "signature does not verify"; exit 1; }
          name=$("$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [ "$name" = "$version" ] || { echo "APK versionName $name but releasing $version"; exit 1; }
          cp "$apk" "mobifixer-$version.apk"
          {
            echo "### Mobifixer $version"
            echo '```'
            head -8 verify.out
            echo '```'
            echo "APK: $(stat -c%s "mobifixer-$version.apk") bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f verify.out

      # Writes NOTES.md and updates/apk.json. A script, not an inline node -e:
      # this package is type:module, so an inline snippet cannot use require,
      # and this way the URL shape is covered by the tests.
      - name: Write the release notes and apk.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-apk.mjs

      - name: Publish the Release
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$version" "mobifixer-$version.apk" \
            --title "Mobifixer $version" \
            --notes-file NOTES.md \
            --repo "$GITHUB_REPOSITORY"

      # apk.json is what the app polls. It names the Release asset, which is a
      # permanent public URL that needs no GitHub login - the app downloads it
      # and hands it to Android's installer, which asks the user to confirm.
      - name: Commit apk.json, so Vercel serves it
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          cat updates/apk.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/apk.json
          git diff --cached --quiet && { echo "apk.json unchanged"; exit 0; }
          git commit -m "Point apk.json at the $version release [skip ci]"
          for i in 1 2 3 4; do git push origin main && break || sleep $((2 ** i)); done

      - uses: actions/upload-artifact@v4
        with:
          name: mobifixer-release-apk
          path: mobifixer-*.apk
          if-no-files-found: error
