name: checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # The suite reads repo files only, with one exception: it pins the
      # notification plugin's own parsing contract, which needs the plugin
      # installed. That test skips without it, so install rather than let the
      # one assertion that would have caught 5.1.1 quietly not run.
      - run: npm ci
      - name: Syntax-check every JavaScript file
        run: node scripts/check.mjs
      - name: Cashbook shop-authorization regression tests
        run: node scripts/test-auth.mjs
      - name: Cashbook AI context regression tests
        run: node scripts/test-ai-context.mjs
      - name: Root app open-jobs reminder tests
        run: node scripts/test-reminder.mjs
      - name: Push sender tests
        run: node scripts/test-push.mjs
      - name: Shop details page tests
        run: node scripts/test-shop-details.mjs
      - name: Shop access / signup safety tests
        run: node scripts/test-shop-access.mjs
      - name: Home job list tests
        run: node scripts/test-home.mjs
      - name: Settings page tests
        run: node scripts/test-settings.mjs
      - name: Job save/edit tests
        run: node scripts/test-job-save.mjs
      - name: Notification permission tests
        run: node scripts/test-notify-permission.mjs
      - name: Presence tests
        run: node scripts/test-presence.mjs
      - name: Admin dashboard tests
        run: node scripts/test-admin.mjs
      - name: Over-the-air release tests
        run: node scripts/test-release-web.mjs
      # Skips cleanly when the emulator is not running. Start it with
      # firebase emulators:start --only database to have it actually check.
      - name: Database rules tests
        run: node scripts/test-firebase-rules.mjs

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # @capacitor/cli 8 declares engines.node >=22, and cap sync is a hard
      # [fatal] below that. The syntax job stays on 20; it only runs node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an Android SDK, but not necessarily the pieces
      # android/variables.gradle pins. Ask for those two by name so a bump to
      # compileSdk there is the only edit needed.
      - name: Install the SDK pieces variables.gradle pins
        run: |
          sdk="$(command -v sdkmanager \
            || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          # The runner pre-accepts the licences for what it ships; this covers
          # anything installed below that it did not.
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0"

      # Maven Central answers 429 often enough to fail a cold build, so keep
      # the resolved dependencies between runs.
      - name: Cache the Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Assemble www/ and sync it into the native project
        run: node scripts/build-www.mjs && npx cap sync android

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Guard what build-www.mjs is responsible for: this app is in the APK,
      # and the other apps in this repo are not. They were 7.1MB of a 9.4MB
      # payload that nothing in Mobifixer could reach, and the easiest way for
      # them to come back is for someone to add a directory to DIRS without
      # checking whether the app links to it.
      - name: Check the APK carries this app and not the others
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for f in assets/public/index.html assets/public/nativeLogic.js \
                   assets/public/auth/main.js; do
            unzip -l "$apk" "$f" | grep -q "$f" || { echo "missing from APK: $f"; exit 1; }
          done
          for d in cashbook accessories ordertraker invoice; do
            if unzip -l "$apk" | grep -q "assets/public/$d/"; then
              echo "$d is back in the APK; nothing in the app can reach it"; exit 1
            fi
          done
          echo "this app present, the others absent, $(stat -c%s "$apk") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: mobifixer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Publishes the over-the-air update the APK polls. Only on main, because
  # Vercel serves updates/ from there and a bundle announced from a branch
  # would be offered to every shop before it was merged.
  #
  # It is a no-op unless the Mobifixer app itself changed AND package.json
  # carries a higher version - a push that only touches cashbook, accessories,
  # ordertraker or invoice publishes nothing, by design.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [syntax, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit below is pushed back to main, so check out the branch
          # rather than the detached commit the trigger gives us.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Assemble the payload
        run: node scripts/build-www.mjs

      - name: Publish an update if, and only if, this app changed
        id: release
        run: |
          node scripts/release-web.mjs | tee release.out
          if git status --porcelain updates/ | grep -q .; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          { echo '```'; cat release.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f release.out

      - name: Commit it, so Vercel serves it
        if: steps.release.outputs.published == 'true'
        run: |
          version=$(node -p "require('./updates/web.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/
          # skip ci: this commit changes only the published bundle, and
          # re-running the workflow on it would find nothing to do anyway.
          git commit -m "Publish web update ${version} [skip ci]"
          for i in 1 2 3 4; do git push origin main && break || sleep $((2 ** i)); done

