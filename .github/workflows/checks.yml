name: checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check every JavaScript file
        run: node scripts/check.mjs
      - name: Cashbook shop-authorization regression tests
        run: node scripts/test-auth.mjs
